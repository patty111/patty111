    <rect x="414" y="0" width="172" height="200" rx="14" fill="#0d1117" stroke="#30363d"/>
    <g transform="translate(500.0 78)" fill="none" stroke="#c9a46a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g class="ico"><g class="spin">
  <circle r="30"/><polygon points="0.0,-10.0 9.5,-3.1 5.9,8.1 -5.9,8.1 -9.5,-3.1"/>
  <path d="M0.0 -10.0 L0.0 -24.0 M9.5 -3.1 L22.8 -7.4 M5.9 8.1 L14.1 19.4 M-5.9 8.1 L-14.1 19.4 M-9.5 -3.1 L-22.8 -7.4"/>
  <path d="M0 -24 L-10 -29 M0 -24 L10 -29 M22.8 -7.4 L29 -10 M22.8 -7.4 L24 3 M14 19.4 L22 22 M14 19.4 L5 24.5 M-14 19.4 L-22 22 M-14 19.4 L-5 24.5 M-22.8 -7.4 L-29 -10 M-22.8 -7.4 L-24 3"/>
</g></g></g>
    <text class="sans" x="500.0" y="152" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="2.5" fill="#e6edf3">FOOTBALL</text>
    <text class="serif" x="500.0" y="175" text-anchor="middle" font-size="14" font-style="italic" fill="#8b949e">ex-winger, still running</text>
