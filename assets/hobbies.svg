<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 1004 204" role="img" aria-labelledby="t d">
  <title id="t">Off the clock</title>
  <desc id="d">Five small line icons: archery target with an arrow, tennis ball, football, checkered flag and beamed musical notes.</desc>
  <style>
    .serif { font-family: Georgia, 'Times New Roman', 'DejaVu Serif', serif; }
    .sans  { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .arrow, .bounce, .shadow, .spin, .wave, .float { transform-box: fill-box; transform-origin: center; }

    /* Base state = finished picture, so reduced-motion users get a clean static strip. */
    .arrow  { animation: shoot 6s ease-out infinite; }
    .bounce { animation: bounce 1.8s cubic-bezier(.3,0,.5,1) infinite alternate; }
    .shadow { animation: shade 1.8s cubic-bezier(.3,0,.5,1) infinite alternate; }
    .spin   { animation: spin 28s linear infinite; }
    .wave   { transform-origin: left center; animation: wave 2.4s ease-in-out infinite alternate; }
    .float  { animation: float 3.2s ease-in-out infinite alternate; }

    @keyframes shoot  { 0% { transform: translate(22px,-22px); opacity: 0; } 7% { transform: none; opacity: 1; } 100% { transform: none; opacity: 1; } }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-12px); } }
    @keyframes shade  { from { transform: scale(1); opacity: .18; } to { transform: scale(.7); opacity: .08; } }
    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes wave   { from { transform: skewY(-4deg); } to { transform: skewY(4deg); } }
    @keyframes float  { from { transform: translateY(2px); } to { transform: translateY(-5px); } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g>
    <rect x="0" y="0" width="172" height="200" rx="14" fill="#0d1117" stroke="#30363d"/>
    <g transform="translate(86.0 78)" fill="none" stroke="#c9a46a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g class="ico">
  <circle r="30"/><circle r="20"/><circle r="10"/><circle r="2.5" fill="#c9a46a" stroke="none"/>
  <g class="arrow"><line x1="2" y1="-2" x2="44" y2="-44"/>
    <path d="M36 -36 L43 -36 M36 -36 L36 -43 M41 -41 L48 -41 M41 -41 L41 -48" /></g>
</g></g>
    <text class="sans" x="86.0" y="152" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="2.5" fill="#e6edf3">ARCHERY</text>
    <text class="serif" x="86.0" y="175" text-anchor="middle" font-size="14" font-style="italic" fill="#8b949e">calm is the technique</text>
  </g>
  <g>
    <rect x="207" y="0" width="172" height="200" rx="14" fill="#0d1117" stroke="#30363d"/>
    <g transform="translate(293.0 78)" fill="none" stroke="#c9a46a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g class="ico">
