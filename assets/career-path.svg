<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="t d">
  <title id="t">Career path, 2021 to 2026</title>
  <desc id="d">A winding path read left to right, then right to left, then left to right again: starts at NTNU in Sep 2021; medical software internships at Jubo Health and Skyvor Medical in Jun 2023; LINE in Mar 2024 with Kafka pipelines; ETHGlobal Bangkok in Nov 2024; imToken in Jul 2025 with Claimable Link V3; Würzburg exchange in Sep 2025; graduated Jun 2026; IEEE BCCA paper in 2026.</desc>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="110" x2="0" y2="490">
      <stop offset="0" stop-color="#6e7f94"/><stop offset=".45" stop-color="#c9a46a"/><stop offset="1" stop-color="#e6c58a"/>
    </linearGradient>
  </defs>
  <style>
    .serif { font-family: Georgia, 'Times New Roman', 'DejaVu Serif', serif; }
    .sans  { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    /* Base state is the finished picture; keyframes only describe the entrance. */
    .draw { stroke-dasharray: 1; animation: draw 5.0s ease-in-out .3s backwards; }
    .pop  { animation: fade .5s ease-out backwards; }
    .fade { animation: fade .8s ease-out backwards; }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

