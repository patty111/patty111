    <circle r="17" fill="#c9a46a" opacity=".13"/><circle r="8" fill="#0d1117" stroke="#c9a46a" stroke-width="2.5"/><circle r="3" fill="#e6c58a"/>
  </g>
  <g class="fade" style="animation-delay:1.83s" text-anchor="middle">
    <text class="sans" x="760" y="74" font-size="14" font-weight="600" letter-spacing="2.4" fill="#c9a46a">MAR 2024</text>
    <text class="serif" x="760" y="104" font-size="26" fill="#e6edf3">LINE</text>
    <text class="sans" x="760" y="172" font-size="16" fill="#8b949e">Kafka pipelines, −87% p95</text>
  </g>
  <g class="pop" style="animation-delay:2.63s" transform="translate(760 300)">
    <circle r="17" fill="#c9a46a" opacity=".13"/><circle r="8" fill="#0d1117" stroke="#c9a46a" stroke-width="2.5"/><circle r="3" fill="#e6c58a"/>
  </g>
  <g class="fade" style="animation-delay:2.78s" text-anchor="middle">
    <text class="sans" x="760" y="244" font-size="14" font-weight="600" letter-spacing="2.4" fill="#c9a46a">NOV 2024</text>
    <text class="serif" x="760" y="274" font-size="26" fill="#e6edf3">ETHGlobal Bangkok</text>
    <text class="sans" x="760" y="342" font-size="16" fill="#8b949e">XMTP Prize winner</text>
  </g>
  <g class="pop" style="animation-delay:3.19s" transform="translate(500 300)">
    <circle r="17" fill="#c9a46a" opacity=".13"/><circle r="8" fill="#0d1117" stroke="#c9a46a" stroke-width="2.5"/><circle r="3" fill="#e6c58a"/>
  </g>
  <g class="fade" style="animation-delay:3.34s" text-anchor="middle">
    <text class="sans" x="500" y="244" font-size="14" font-weight="600" letter-spacing="2.4" fill="#c9a46a">JUL 2025</text>
    <text class="serif" x="500" y="274" font-size="26" fill="#e6edf3">imToken</text>
    <text class="sans" x="500" y="342" font-size="16" fill="#8b949e">Claimable Link V3, EVM L2s</text>
  </g>
  <g class="pop" style="animation-delay:3.74s" transform="translate(240 300)">
    <circle r="17" fill="#c9a46a" opacity=".13"/><circle r="8" fill="#0d1117" stroke="#c9a46a" stroke-width="2.5"/><circle r="3" fill="#e6c58a"/>
  </g>
  <g class="fade" style="animation-delay:3.89s" text-anchor="middle">
    <text class="sans" x="240" y="244" font-size="14" font-weight="600" letter-spacing="2.4" fill="#c9a46a">SEP 2025</text>
    <text class="serif" x="240" y="274" font-size="26" fill="#e6edf3">Würzburg</text>
    <text class="sans" x="240" y="342" font-size="16" fill="#8b949e">Exchange in Germany</text>
  </g>
  <g class="pop" style="animation-delay:4.69s" transform="translate(240 470)">
    <circle r="17" fill="#c9a46a" opacity=".13"/><circle r="8" fill="#0d1117" stroke="#c9a46a" stroke-width="2.5"/><circle r="3" fill="#e6c58a"/>
  </g>
  <g class="fade" style="animation-delay:4.84s" text-anchor="middle">
    <text class="sans" x="240" y="414" font-size="14" font-weight="600" letter-spacing="2.4" fill="#c9a46a">JUN 2026</text>
    <text class="serif" x="240" y="444" font-size="26" fill="#e6edf3">Graduated</text>
    <text class="sans" x="240" y="512" font-size="16" fill="#8b949e">NTNU, class of 2026</text>
  </g>
  <g class="pop" style="animation-delay:5.25s" transform="translate(500 470)">
    <circle r="17" fill="#c9a46a" opacity=".13"/><circle r="8" fill="#0d1117" stroke="#c9a46a" stroke-width="2.5"/><circle r="3" fill="#e6c58a"/>
  </g>
  <g class="fade" style="animation-delay:5.40s" text-anchor="middle">
    <text class="sans" x="500" y="414" font-size="14" font-weight="600" letter-spacing="2.4" fill="#c9a46a">2026</text>
    <text class="serif" x="500" y="444" font-size="26" fill="#e6edf3">IEEE BCCA</text>
    <text class="sans" x="500" y="512" font-size="16" fill="#8b949e">Paper accepted</text>
  </g>
  <g class="pop" style="animation-delay:5.80s" transform="translate(760 470)">
    <circle r="17" fill="#c9a46a" opacity=".13"/><circle r="8" fill="#0d1117" stroke="#e6c58a" stroke-width="2.5" stroke-dasharray="3.2 3.2"/>
  </g>
  <g class="fade" style="animation-delay:5.95s" text-anchor="middle">
    <text class="sans" x="760" y="414" font-size="14" font-weight="600" letter-spacing="2.4" fill="#c9a46a">NEXT</text>
    <text class="serif" x="760" y="444" font-size="26" fill="#e6edf3">Backend / Web3</text>
    <text class="sans" x="760" y="512" font-size="16" fill="#8b949e">Open to the right team</text>
  </g>
</svg>
