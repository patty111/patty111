name: Update contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:       # lets you run it by hand from the Actions tab
  push:                    # also runs once when you upload/change this file
    paths:
      - ".github/workflows/snake.yml"
      - ".github/scripts/make_snake.py"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
          LOGIN: ${{ github.repository_owner }}
        run: |
          gh api graphql -f login="$LOGIN" -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays { date contributionCount contributionLevel weekday }
                    }
                  }
                }
              }
            }' > calendar.json

      - name: Draw the snake
        run: python3 .github/scripts/make_snake.py calendar.json assets/snake.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh contribution snake"
            git push
          finame: Update contribution snake

